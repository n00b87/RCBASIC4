	<script>
	var doc_frame_loaded = false
		
	function onIframeLoad() 
	{
		if(!doc_frame_loaded)
		{
			var cover_page_contents = ""
			cover_page_contents += "<!DOCTYPE html>"
			cover_page_contents += "<html><head>"
			cover_page_contents += "<link rel=\"stylesheet\" href=\"style.css\">"

			cover_page_contents += "The Revolution will be written in BASIC</div>"
			cover_page_contents += "</body></html>"
			
			
			const m_frame = window.frames['main']
			console.log("loaded")
			doc_frame_loaded = true
			m_frame.document.open()
			m_frame.document.write(cover_page_contents)
			m_frame.document.close()
		}
	}

	/* The search container stays locked at the top */
    .search-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #173E47;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000; /* Keeps it above other elements */
    }

    
    
    /* Reset and prepare the page container */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents whole-page scrolling */
            display: flex;
            flex-direction: column;
        }

        

        /* The iframe automatically fills all remaining vertical space */
        .fill-remaining-iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            display: block;
        }
        
        .iframe-positioned {
			position: fixed;
			top: 30px;  /* Starts 100px from the top */
			bottom: 0;   /* Stretches to the very bottom */
			left: 0;
			right: 0;
			width: 100%;
			height: calc(100vh - 30px); /* Explicitly calculates remaining viewport height */
			border: none;
		}
