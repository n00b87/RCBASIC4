		<p><h2>Function GetActorContactDamping( actor ) </h2></p>
		<p>
		 Returns an actor's damping value 
		</p>
		<p>
		 Damping: Acts on the velocity level to dissipate relative motion between colliding objects, bringing bouncing or vibrating contacts to rest.
