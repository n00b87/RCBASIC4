		<p><h2>Sub SetWheelSuspensionStiffness( actor, wheel, stiffness ) </h2></p>
		<p>
		 Sets the suspension stiffness of a wheel. 
		</p>
		<ul>
		<li>
		Higher stiffness - stronger upward force for the same compression 
		</li>
		<li>
		Lower stiffness - softer suspension 
		</li>
		</ul>
